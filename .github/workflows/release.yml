name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore IISLogExplorer.slnx

      - name: Build
        run: dotnet build IISLogExplorer.slnx -c Release

      - name: Test
        run: dotnet test IISLogExplorer.slnx -c Release

      - name: Publish portable
        run: dotnet publish src/IISLogExplorer.App/IISLogExplorer.App.csproj -c Release -p:PublishProfile=Portable-win-x64 -o publish

      - name: Package zip
        shell: pwsh
        run: |
          Remove-Item publish/*.pdb -ErrorAction SilentlyContinue
          Compress-Archive -Path publish/* -DestinationPath IISLogExplorer-win-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: IISLogExplorer-win-x64
          path: IISLogExplorer-win-x64.zip