name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'README.en.md'
      - 'docs/**'
      - 'RELEASE/**'
      - '**/*.md'
      - 'LICENSE'
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore IISLogExplorer.slnx

      - name: Build
        run: dotnet build IISLogExplorer.slnx -c Release

      - name: Test
        run: dotnet test IISLogExplorer.slnx -c Release

      - name: Publish
        run: dotnet publish src/IISLogExplorer.App/IISLogExplorer.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
